name: Market brief data (run now)

on:
  push:
    paths:
      - .github/workflows/run-now.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency: market-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        run: |
          unzip -qo market-brief-job.zip -d /tmp/app
          cd /tmp/app
          pip install -q -r requirements.txt
          python -m pytest -q tests
          MB_OUT="$GITHUB_WORKSPACE/data" python -m job.run
      - name: Save data
        run: |
          git config user.name "market-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Data for $(jq -r .last_session data/status.json)"; git pull --rebase -q; git push; }

